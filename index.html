<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta autor="Thierry Leclercq" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./public/assets/css/style.css" />
        <title>Jeu - Sudoku</title>
    </head>

    <body class="bg-linear-to-r from-yellow-500 to-red-600 text-center">
        <h1 class="my-2.5 text-3xl">Sudoku</h1>

        <h2 class="my-1.5 text-2xl underline decoration-1">Règles du jeu</h2>
        <p class="mx-2.5 text-justify leading-5">
            Vous devez remplir la grille en utilisant les chiffres de 1 à 9 selon la règle suivante :
            chaque carré, chaque ligne et chaque colonne ne peut comporter qu'une seule fois chaque chiffre.
            Le bouton Effacer sert à effacer la grille (Nouvelle grille).
        </p>

        <div
            id="container"
            class="mx-0 my-2.5 flex flex-wrap items-center justify-center bg-amber-50 text-center sm:mx-auto sm:h-160 sm:w-160"
        ></div>

        <div class="mt-2.5 flex justify-center gap-2">
            <button id="btn_clear" class="btn-choice">Effacer</button>
            <!-- Les boutons 1 à 9 seront générés ici -->
            <div id="digit_buttons"></div>
        </div>

        <script src="./public/assets/js/grid.js"></script>
        <script src="./public/assets/js/buttons.js"></script>
        <script src="./public/assets/js/script.js" type="module"></script>
    </body>
</html>
